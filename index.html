<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#78c8ed">
<title>CAT CITY RUNNER</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#171b27;
  font-family:Arial,sans-serif;
  overflow:hidden;
  touch-action:none;
  user-select:none;
}
.game{
  width:100%;
  max-width:900px;
  margin:auto;
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:12px;
}
.top{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:white;
  flex-shrink:0;
}
.logo{
  font-weight:1000;
  font-size:19px;
  letter-spacing:1px;
}
.logo span{color:#ffcf43}
.score{
  background:#ffffff20;
  border:1px solid #ffffff30;
  border-radius:12px;
  padding:9px 15px;
  font-weight:bold;
}
#score{color:#ffdc58}
.stage{
  flex:1;
  min-height:0;
  position:relative;
  border-radius:20px;
  overflow:hidden;
  border:3px solid #ffffff40;
  background:#8bd5f2;
}
canvas{
  width:100%;
  height:100%;
  display:block;
}
.overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:#17202bbd;
  padding:20px;
}
.panel{
  background:#fff;
  color:#252b37;
  border-radius:24px;
  padding:28px 22px;
  width:min(100%,340px);
  box-shadow:0 15px 40px #0005;
}
.cat-icon{font-size:65px;margin-bottom:8px}
.panel h1{font-size:26px;margin-bottom:12px}
.panel p{font-size:14px;line-height:1.8;color:#555;margin-bottom:20px}
button{
  border:0;
  border-radius:13px;
  padding:15px 25px;
  font-size:15px;
  font-weight:900;
  background:#ffca3a;
  color:#252b37;
  cursor:pointer;
}
.controls{
  height:80px;
  flex-shrink:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
}
.control{
  width:65px;
  height:55px;
  border-radius:17px;
  background:#ffffff20;
  color:white;
  border:1px solid #ffffff50;
  font-size:25px;
}
.control.jump{
  width:100px;
  background:#ffca3a;
  color:#222;
  font-size:15px;
}
@media(orientation:landscape){
  .controls{height:65px}
}
</style>
</head>

<body>
<div class="game">

  <div class="top">
    <div class="logo">🐱 CAT <span>CITY RUNNER</span></div>
    <div class="score">SCORE: <span id="score">0</span></div>
  </div>

  <div class="stage">
    <canvas id="canvas"></canvas>

    <div class="overlay" id="overlay">
      <div class="panel">
        <div class="cat-icon">🐱</div>
        <h1>CAT CITY RUNNER</h1>
        <p>
          A crazy cat is running through the city!<br>
          Dodge cars, avoid obstacles and survive!
        </p>
        <button id="start">START RUNNING 🐾</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="control" id="left">◀</button>
    <button class="control jump" id="jump">JUMP ↑</button>
    <button class="control" id="right">▶</button>
  </div>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay");
const scoreText=document.getElementById("score");

let W=600,H=700;
let running=false;
let score=0;
let speed=5;
let frame=0;
let obstacles=[];
let particles=[];
let people=[];
let roadOffset=0;

const cat={
  lane:1,
  x:300,
  y:0,
  jump:0,
  velocity:0,
  width:65,
  height:75
};

function resize(){
  const r=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=r.width*dpr;
  canvas.height=r.height*dpr;
  W=r.width;
  H=r.height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cat.y=H-145;
  draw();
}
window.addEventListener("resize",resize);

function road(){
  // Sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#75c9f0");
  sky.addColorStop(1,"#d5f0ed");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // Sun
  ctx.fillStyle="#ffe68a";
  ctx.beginPath();
  ctx.arc(W-65,75,35,0,Math.PI*2);
  ctx.fill();

  // Buildings
  const buildingW=W/7;
  for(let i=0;i<9;i++){
    let x=i*buildingW-(roadOffset*.25%buildingW);
    let bh=100+(i*47%130);
    ctx.fillStyle=["#e9a66b","#b9a5d9","#e2c56f","#8eb9ad"][i%4];
    ctx.fillRect(x,170-bh/2,buildingW-5,bh);

    ctx.fillStyle="#fff2b3";
    for(let j=0;j<3;j++){
      ctx.fillRect(x+10+j*16,180-bh/2,8,13);
      ctx.fillRect(x+10+j*16,210-bh/2,8,13);
    }
  }

  // Sidewalks
  ctx.fillStyle="#d3c4a8";
  ctx.fillRect(0,H*.38,W,H*.62);

  // Road
  const roadLeft=W*.12;
  const roadRight=W*.88;
  ctx.fillStyle="#555b65";
  ctx.fillRect(roadLeft,H*.38,roadRight-roadLeft,H*.62);

  // Road edges
  ctx.fillStyle="#eee2c7";
  ctx.fillRect(roadLeft-7,H*.38,7,H*.62);
  ctx.fillRect(roadRight,H*.38,7,H*.62);

  // Lane separators
  ctx.strokeStyle="#ffffffaa";
  ctx.lineWidth=3;
  ctx.setLineDash([24,25]);
  ctx.lineDashOffset=-roadOffset;
  for(let i=1;i<3;i++){
    let x=roadLeft+(roadRight-roadLeft)*i/3;
    ctx.beginPath();
    ctx.moveTo(x,H*.4);
    ctx.lineTo(x,H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Sidewalk pedestrians
  for(let i=0;i<5;i++){
    let x=(i*W/4-roadOffset*.5%W+W)%W;
    person(x,H*.47,0.55);
  }
}

function person(x,y,s=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.fillStyle="#f2bd91";
  ctx.beginPath();
  ctx.arc(0,-25,9,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=["#e85c5c","#4b83ca","#e9bb43"][Math.floor(x/30)%3];
  ctx.fillRect(-9,-15,18,25);

  ctx.strokeStyle="#30313a";
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(-5,10);ctx.lineTo(-8,23);
  ctx.moveTo(5,10);ctx.lineTo(9,23);
  ctx.stroke();
  ctx.restore();
}

function drawCat(){
  const x=cat.x;
  const y=cat.y-cat.jump;

  // Shadow
  ctx.fillStyle="#0004";
  ctx.beginPath();
  ctx.ellipse(x,H-65,30,8,0,0,Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(x,y);

  // Tail
  ctx.strokeStyle="#6c778b";
  ctx.lineWidth=10;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(-18,15);
  ctx.quadraticCurveTo(-48,-5,-33,-30);
  ctx.stroke();

  // Body
  ctx.fillStyle="#8793a7";
  ctx.beginPath();
  ctx.ellipse(0,15,22,30,0,0,Math.PI*2);
  ctx.fill();

  // Belly
  ctx.fillStyle="#e7e0d7";
  ctx.beginPath();
  ctx.ellipse(3,17,12,21,0,0,Math.PI*2);
  ctx.fill();

  // Head
  ctx.fillStyle="#8793a7";
  ctx.beginPath();
  ctx.arc(0,-20,26,0,Math.PI*2);
  ctx.fill();

  // Ears
  ctx.beginPath();
  ctx.moveTo(-22,-34);ctx.lineTo(-24,-60);ctx.lineTo(-5,-43);
  ctx.moveTo(22,-34);ctx.lineTo(24,-60);ctx.lineTo(5,-43);
  ctx.fill();

  // Inner ears
  ctx.fillStyle="#ed9d9b";
  ctx.beginPath();
  ctx.moveTo(-20,-43);ctx.lineTo(-21,-54);ctx.lineTo(-12,-45);
  ctx.moveTo(20,-43);ctx.lineTo(21,-54);ctx.lineTo(12,-45);
  ctx.fill();

  // Eyes
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.ellipse(-10,-23,8,11,0,0,Math.PI*2);
  ctx.ellipse(10,-23,8,11,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#263e55";
  ctx.beginPath();
  ctx.arc(-8,-22,3,0,Math.PI*2);
  ctx.arc(12,-22,3,0,Math.PI*2);
  ctx.fill();

  // Muzzle
  ctx.fillStyle="#f2e6d9";
  ctx.beginPath();
  ctx.ellipse(0,-7,14,9,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#e88e91";
  ctx.beginPath();
  ctx.arc(0,-12,4,0,Math.PI*2);
  ctx.fill();

  // Smile
  ctx.strokeStyle="#30313a";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(0,-8);ctx.lineTo(0,-3);
  ctx.arc(-5,-3,5,0,Math.PI/2);
  ctx.moveTo(0,-3);ctx.arc(5,-3,5,Math.PI/2,Math.PI);
  ctx.stroke();

  // Whiskers
  ctx.strokeStyle="#555";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(-10,-8);ctx.lineTo(-30,-12);
  ctx.moveTo(-10,-5);ctx.lineTo(-30,-3);
  ctx.moveTo(10,-8);ctx.lineTo(30,-12);
  ctx.moveTo(10,-5);ctx.lineTo(30,-3);
  ctx.stroke();

  // Feet
  ctx.fillStyle="#e7e0d7";
  ctx.beginPath();
  ctx.ellipse(-13,43,11,6,0,0,Math.PI*2);
  ctx.ellipse(13,43,11,6,0,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function car(x,y,color){
  ctx.save();
  ctx.translate(x,y);

  // Wheels
  ctx.fillStyle="#20242c";
  ctx.fillRect(4,32,13,22);
  ctx.fillRect(55,32,13,22);

  // Body
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.roundRect(0,5,72,49,12);
  ctx.fill();

  // Windows
  ctx.fillStyle="#bce9f5";
  ctx.beginPath();
  ctx.roundRect(13,-9,46,25,8);
  ctx.fill();

  ctx.fillStyle="#ffffff";
  ctx.fillRect(35,-7,3,20);

  // Lights
  ctx.fillStyle="#ffe78a";
  ctx.fillRect(2,35,7,8);
  ctx.fillRect(63,35,7,8);

  ctx.restore();
}

function obstacle(){
  const lane=Math.floor(Math.random()*3);
  const type=Math.random()>.25?"car":"person";
  obstacles.push({
    lane,
    y:-100,
    type,
    color:["#e65353","#e9b83e","#4c8bc5","#5db68c"][Math.floor(Math.random()*4)]
  });
}

function laneX(lane){
  return W*.12+(W*.76)*(lane+.5)/3;
}

function drawObstacles(){
  obstacles.forEach(o=>{
    const x=laneX(o.lane);
    if(o.type==="car"){
      car(x-36,o.y,o.color);
    }else{
      person(x,o.y+45,1.5);
    }
  });
}

function moveLeft(){
  if(running)cat.lane=Math.max(0,cat.lane-1);
}
function moveRight(){
  if(running)cat.lane=Math.min(2,cat.lane+1);
}
function jump(){
  if(running&&cat.jump===0){
    cat.velocity=16;
  }
}

function finish(){
  running=false;
  overlay.style.display="flex";
  overlay.innerHTML=`
    <div class="panel">
      <div class="cat-icon">😿</div>
      <h1>OH NO!</h1>
      <p>The cat crashed!<br>Your score: <b>${Math.floor(score)}</b></p>
      <button onclick="startGame()">TRY AGAIN 🐾</button>
    </div>`;
}

function update(){
  if(!running)return;

  frame++;
  score+=0.15;
  speed=Math.min(12,5+score/150);
  roadOffset+=speed;

  scoreText.textContent=Math.floor(score);

  // Jump physics
  if(cat.velocity!==0||cat.jump>0){
    cat.jump+=cat.velocity;
    cat.velocity-=0.8;
    if(cat.jump<=0){
      cat.jump=0;
      cat.velocity=0;
    }
  }

  // Smooth lane movement
  const target=laneX(cat.lane);
  cat.x+=(target-cat.x)*0.22;

  if(frame%Math.max(45,85-Math.floor(speed*3))===0){
    obstacle();
  }

  obstacles.forEach(o=>{
    o.y+=speed;
  });

  obstacles=obstacles.filter(o=>o.y<H+100);

  // Collision
  obstacles.forEach(o=>{
    const sameLane=cat.lane===o.lane;
    const close=Math.abs(o.y-(H-120))<42;

    if(sameLane&&close&&cat.jump<45){
      finish();
    }
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  road();
  drawObstacles();
  drawCat();
}

function loop(){
  if(!running)return;
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame(){
  score=0;
  speed=5;
  frame=0;
  roadOffset=0;
  obstacles=[];
  cat.lane=1;
  cat.jump=0;
  cat.velocity=0;
  cat.x=laneX(1);
  cat.y=H-145;

  scoreText.textContent="0";
  overlay.style.display="none";
  running=true;
  loop();
}

document.getElementById("start").onclick=startGame;
document.getElementById("left").onclick=moveLeft;
document.getElementById("right").onclick=moveRight;
document.getElementById("jump").onclick=jump;

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")moveLeft();
  if(e.key==="ArrowRight")moveRight();
  if(e.key==="ArrowUp"||e.key===" ")jump();
});

// Swipe controls
let touchX=null;
let touchY=null;

canvas.addEventListener("touchstart",e=>{
  touchX=e.touches[0].clientX;
  touchY=e.touches[0].clientY;
},{passive:true});

canvas.addEventListener("touchend",e=>{
  if(touchX===null)return;

  const dx=e.changedTouches[0].clientX-touchX;
  const dy=e.changedTouches[0].clientY-touchY;

  if(Math.abs(dx)>35){
    dx<0?moveLeft():moveRight();
  }else if(dy<-25){
    jump();
  }else{
    jump();
  }

  touchX=null;
  touchY=null;
},{passive:true});

resize();
</script>
</body>
</html>
