<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#edf1f8">

<title>حمزة بهاء الدين | حساباتي الرسمية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #edf1f8;
  --text: #202337;
  --muted: #777d91;
  --glass: rgba(255,255,255,.62);
  --border: rgba(255,255,255,.9);
  --accent: #7660cb;
  --shadow: rgba(65,75,110,.12);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: 'Cairo', sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 15% 15%, rgba(166,144,239,.22), transparent 36%),
    radial-gradient(circle at 85% 80%, rgba(109,188,222,.20), transparent 36%),
    var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 35px 16px;
}

.container {
  width: 100%;
  max-width: 440px;
  text-align: center;
  animation: appear .8s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(22px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.profile {
  width: 118px;
  height: 118px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid white;
  padding: 4px;
  background: white;
  box-shadow: 0 10px 35px rgba(90,80,160,.20);
  margin-bottom: 15px;
}

h1 {
  font-size: 28px;
  font-weight: 800;
  color: #25243b;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
  margin-bottom: 28px;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.social {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 13px 17px;
  min-height: 70px;
  text-decoration: none;
  color: var(--text);

  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 19px;

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  box-shadow: 0 8px 25px var(--shadow);

  transition:
    transform .22s ease,
    box-shadow .22s ease,
    background .22s ease,
    border-color .22s ease;

  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

.social::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(
    110deg,
    transparent,
    rgba(255,255,255,.65),
    transparent
  );
  transform: skewX(-20deg);
  transition: left .6s ease;
}

.social:hover::before {
  left: 150%;
}

.social:hover {
  transform: translateY(-4px);
  border-color: rgba(118,96,203,.35);
  box-shadow: 0 13px 30px rgba(65,75,110,.17);
}

.social:active {
  transform: scale(.96);
  background: rgba(255,255,255,.9);
}

.social-icon {
  width: 43px;
  height: 43px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: rgba(255,255,255,.75);
  flex-shrink: 0;
}

.social-icon svg {
  width: 23px;
  height: 23px;
  fill: currentColor;
}

.social-info {
  text-align: right;
  flex: 1;
}

.social-info strong {
  display: block;
  font-size: 14px;
  font-weight: 700;
}

.social-info span {
  display: block;
  font-size: 11px;
  color: var(--muted);
  direction: ltr;
  text-align: right;
}

.arrow {
  font-size: 19px;
  color: #9296a8;
  transition: transform .2s ease;
}

.social:hover .arrow {
  transform: translateX(-5px);
  color: var(--accent);
}

.instagram .social-icon {
  color: #d94c91;
}

.facebook .social-icon {
  color: #2879e8;
}

.snapchat .social-icon {
  color: #b39b00;
}

.tiktok .social-icon {
  color: #168e85;
}

.pinterest .social-icon {
  color: #d92f48;
}

.x-social .social-icon {
  color: #202337;
}

.footer {
  color: var(--muted);
  font-size: 11px;
  margin-top: 27px;
  padding-bottom: 10px;
}

@media (max-width: 380px) {
  h1 {
    font-size: 24px;
  }

  .social {
    padding: 11px 13px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
