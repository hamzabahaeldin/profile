<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Hamza Bahaeldin - Personal Profile">

  <title>Hamza Bahaeldin | Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --red: #e63946;
      --white: #f5f5f5;
      --muted: #929292;
      --glass: rgba(255,255,255,0.045);
      --border: rgba(255,255,255,0.10);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 15%, rgba(230,57,70,0.13), transparent 42%),
        var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 18px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 410px;
      text-align: center;
      animation: appear 1s ease both;
    }

    .top-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      background: var(--glass);
      border-radius: 30px;
      color: #c8c8c8;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 30px;
      backdrop-filter: blur(15px);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #55d68b;
      border-radius: 50%;
      box-shadow: 0 0 10px #55d68b;
    }

    .avatar-wrap {
      width: 142px;
      height: 142px;
      margin: 0 auto 22px;
      padding: 5px;
      border: 1px solid rgba(230,57,70,0.65);
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(230,57,70,0.12);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #171717;
    }

    h1 {
      font-size: clamp(27px, 7vw, 34px);
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 9px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 19px;
    }

    .bio {
      color: #b8b8b8;
      font-size: 13px;
      line-height: 1.8;
      max-width: 300px;
      margin: 0 auto 30px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 59px;
      padding: 15px 20px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--glass);
      color: var(--white);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(18px);
      transition: 0.25s ease;
      overflow: hidden;
    }

    .link:hover {
      border-color: rgba(230,57,70,0.65);
      background: rgba(230,57,70,0.10);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(230,57,70,0.08);
    }

    .link:active {
      transform: scale(0.98);
    }

    .link-icon {
      position: absolute;
      left: 19px;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      color: #e8e8e8;
    }

    .link-icon svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .footer {
      margin-top: 35px;
      color: #626262;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .footer span {
      color: var(--red);
    }

    .click-effect {
      position: fixed;
      width: 8px;
      height: 8px;
      border: 1px solid var(--red);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: ripple 0.55s ease-out forwards;
      z-index: 99;
    }

    @keyframes ripple {
      to {
        width: 65px;
        height: 65px;
        opacity: 0;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 380px) {
      .avatar-wrap {
        width: 125px;
        height: 125px;
      }
      .link {
        min-height: 55px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="top-label">
      <span class="status-dot"></span>
      PERSONAL PROFILE
    </div>

    <div class="avatar-wrap">
      <img
        class="avatar"
        src="profile.png.png"
        alt="Hamza Bahaeldin"
      >
    </div>

    <h1>Hamza Bahaeldin</h1>

    <p class="subtitle">Entrepreneur & Digital Business</p>

    <p class="bio">
      Building ideas into reality.
      Focused on business, technology and creating new opportunities.
    </p>

    <div class="links">

      <a class="link"
         href="https://www.instagram.com/hamza_bahaeldin?exln=MTZ4bjR6aWsycGF1OA=="
         target="_blank"
         rel="noopener noreferrer">
        <span class="link-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="18" cy="6" r="0.8"/>
          </svg>
        </span>
        Instagram
      </a>

      <a class="link"
         href="https://www.snapchat.com/add/ebrezz?share_id=T6WGyzLw8II&locale=ar-EG-u-nu-arab"
         target="_blank"
         rel="noopener noreferrer">
        <span class="link-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3c-3 0-4.5 2.2-4.5 5v3c0 1-.8 1.7-2 2-.7.2-1.4.3-2 .7 0 .7 1.7 1.2 2.5 1.4.5.2.7.8 1 1.3.4.8 1.2 1.3 2.2 1.3 1.1 0 1.7.5 2.8.5s1.7-.5 2.8-.5c1 0 1.8-.5 2.2-1.3.3-.5.5-1.1 1-1.3.8-.2 2.5-.7 2.5-1.4-.6-.4-1.3-.5-2-.7-1.2-.3-2-.9-2-2V8c0-2.8-1.5-5-4.5-5z"/>
          </svg>
        </span>
        Snapchat
      </a>

      <a class="link"
         href="https://wa.me/249123600477"
         target="_blank"
         rel="noopener noreferrer">
        <span class="link-icon">
          <svg viewBox="0 0 24 24">
            <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5z"/>
            <path d="M9 9c.5 2 2 3.5 4 4l1-1 2 1c-.3 1.5-1.5 2-3 1.5-2.5-1-4.5-3-5-5.5-.3-1.5.5-2.5 2-2.5l1 2z"/>
          </svg>
        </span>
        WhatsApp
      </a>

    </div>

    <div class="footer">
      DESIGNED WITH <span>♥</span> BY HAMZA
    </div>

  </main>

  <script>
    // Simple click sound
    function playClickSound() {
      try {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        const audio = new AudioContext();
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(520, audio.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(
          220, audio.currentTime + 0.09
        );

        gain.gain.setValueAtTime(0.045, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.001, audio.currentTime + 0.1
        );

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.start();
        oscillator.stop(audio.currentTime + 0.1);

        oscillator.onended = () => audio.close();
      } catch (error) {
        // Sound is optional
      }
    }

    // Click ripple and sound
    document.querySelectorAll(".link").forEach(link => {
      link.addEventListener("click", event => {
        playClickSound();

        const ripple = document.createElement("span");
        ripple.className = "click-effect";
        ripple.style.left = event.clientX + "px";
        ripple.style.top = event.clientY + "px";

        document.body.appendChild(ripple);

        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>

</body>
</html>
