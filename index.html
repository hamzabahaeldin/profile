<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080808">
<title>HAMZA RUNNER</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  touch-action: none;
}

.game {
  width: 100%;
  max-width: 850px;
  padding: 18px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.logo {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 3px;
}

.logo span {
  color: #ed3447;
}

.score-box {
  text-align: right;
  color: #999;
  font-size: 10px;
  letter-spacing: 2px;
}

#score {
  color: white;
  font-size: 23px;
  font-weight: bold;
  display: block;
  margin-top: 4px;
}

.stage {
  position: relative;
  width: 100%;
  border: 1px solid #292929;
  border-radius: 18px;
  overflow: hidden;
  background: #101010;
  box-shadow: 0 15px 60px rgba(0,0,0,.6);
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(5px);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

.panel h1 {
  font-size: clamp(27px, 7vw, 42px);
  letter-spacing: 3px;
  margin-bottom: 12px;
}

.panel h1 span {
  color: #ed3447;
}

.panel p {
  color: #aaa;
  font-size: 13px;
  line-height: 1.8;
  margin-bottom: 24px;
}

button {
  background: #ed3447;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 15px 35px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

.hint {
  text-align: center;
  color: #777;
  font-size: 11px;
  letter-spacing: 1px;
  margin-top: 18px;
}

#jumpButton {
  display: none;
  width: 100%;
  margin-top: 15px;
  background: #171717;
  border: 1px solid #333;
  color: white;
}

@media (pointer: coarse) {
  #jumpButton { display: block; }
}
</style>
</head>

<body>

<div class="game">

  <div class="header">
    <div class="logo">HAMZA <span>RUNNER</span></div>
    <div class="score-box">
      YOUR SCORE
      <span id="score">0000</span>
    </div>
  </div>

  <div class="stage">

    <canvas id="gameCanvas" width="850" height="390"></canvas>

    <div class="overlay" id="overlay">
      <div class="panel">
        <h1>HAMZA <span>RUNNER</span></h1>
        <p>
          Run as far as you can.<br>
          Jump over obstacles and beat your record.
        </p>
        <button id="startButton">START GAME</button>
      </div>
    </div>

  </div>

  <button id="jumpButton">TAP TO JUMP ↑</button>

  <div class="hint">
    TAP TO JUMP &nbsp; • &nbsp; AVOID THE OBSTACLES
  </div>

</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const overlay = document.getElementById("overlay");
const startButton = document.getElementById("startButton");

const W = canvas.width;
const H = canvas.height;
const ground = 320;

let running = false;
let gameOver = false;
let score = 0;
let speed = 5;
let frame = 0;
let obstacles = [];
let particles = [];

const player = {
  x: 100,
  y: ground - 58,
  w: 37,
  h: 58,
  vy: 0,
  gravity: 0.75,
  jumpPower: -15,
  grounded: true
};

function drawBackground() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, "#111111");
  gradient.addColorStop(1, "#191919");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // Background glow
  const glow = ctx.createRadialGradient(
    600, 180, 10, 600, 180, 300
  );

  glow.addColorStop(0, "rgba(237,52,71,0.09)");
  glow.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Background stars
  for (let i = 0; i < 35; i++) {
    let x = (i * 97 - frame * 0.25) % W;
    if (x < 0) x += W;

    let y = 35 + (i * 43) % 220;

    ctx.fillStyle = "rgba(255,255,255,0.17)";
    ctx.fillRect(x, y, 2, 2);
  }

  // Ground
  ctx.fillStyle = "#292929";
  ctx.fillRect(0, ground, W, 3);

  ctx.fillStyle = "#ed3447";
  ctx.fillRect(0, ground, W, 2);

  // Ground details
  for (let i = 0; i < 22; i++) {
    let x = (i * 75 - frame * speed) % W;
    if (x < 0) x += W;

    ctx.fillStyle = "#303030";
    ctx.fillRect(x, ground + 20, 28, 2);
  }
}

function drawPlayer() {
  ctx.save();

  const x = player.x;
  const y = player.y;

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath();
  ctx.ellipse(x + 20, ground + 3, 25, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.fillStyle = "#ed3447";
  ctx.fillRect(x + 7, y + 20, 25, 27);

  // Head
  ctx.fillStyle = "#f2c6a5";
  ctx.beginPath();
  ctx.arc(x + 20, y + 12, 12, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = "#171717";
  ctx.beginPath();
  ctx.arc(x + 20, y + 8, 12, Math.PI, Math.PI * 2);
  ctx.fill();

  // Eye
  ctx.fillStyle = "#111";
  ctx.fillRect(x + 27, y + 11, 3, 3);

  // Arms
  ctx.strokeStyle = "#f2c6a5";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";

  let swing = player.grounded
    ? Math.sin(frame * 0.3) * 8 : -4;

  ctx.beginPath();
  ctx.moveTo(x + 10, y + 26);
  ctx.lineTo(x + 2, y + 34 + swing);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x + 28, y + 26);
  ctx.lineTo(x + 36, y + 34 - swing);
  ctx.stroke();

  // Legs
  ctx.strokeStyle = "#eeeeee";
  ctx.lineWidth = 6;

  ctx.beginPath();
  ctx.moveTo(x + 13, y + 46);
  ctx.lineTo(x + 10 + swing, y + 57);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x + 27, y + 46);
  ctx.lineTo(x + 30 - swing, y + 57);
  ctx.stroke();

  ctx.restore();
}

function drawTree(x, y) {
  ctx.save();

  // Trunk
  ctx.fillStyle = "#70452d";
  ctx.fillRect(x + 18, y + 27, 9, 30);

  // Leaves
  ctx.fillStyle = "#347b4d";

  ctx.beginPath();
  ctx.moveTo(x + 22, y);
  ctx.lineTo(x, y + 35);
  ctx.lineTo(x + 44, y + 35);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 22, y + 12);
  ctx.lineTo(x + 4, y + 43);
  ctx.lineTo(x + 40, y + 43);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawRock(x, y) {
  ctx.fillStyle = "#888888";

  ctx.beginPath();
  ctx.moveTo(x, y + 25);
  ctx.lineTo(x + 8, y + 5);
  ctx.lineTo(x + 27, y);
  ctx.lineTo(x + 43, y + 25);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#aaaaaa";
  ctx.fillRect(x + 12, y + 9, 8, 3);
}

function spawnObstacle() {
  const type = Math.random() > 0.35 ? "tree" : "rock";

  obstacles.push({
    x: W + 20,
    type,
    w: type === "tree" ? 44 : 43,
    h: type === "tree" ? 57 : 25
  });
}

function jump() {
  if (!running) return;

  if (player.grounded) {
    player.vy = player.jumpPower;
    player.grounded = false;
  }
}

function collision(a, b) {
  return (
    a.x + 9 < b.x + b.w - 7 &&
    a.x + a.w - 7 > b.x + 7 &&
    a.y + 7 < b.y + b.h &&
    a.y + a.h > b.y + 5
  );
}

function endGame() {
  running = false;
  gameOver = true;

  overlay.style.display = "flex";

  overlay.innerHTML = `
    <div class="panel">
      <h1>GAME <span>OVER</span></h1>
      <p>
        Your score: <strong style="color:white">${Math.floor(score)}</strong><br>
        Keep going. You can do better!
      </p>
      <button id="restartButton">PLAY AGAIN</button>
    </div>
  `;

  document.getElementById("restartButton")
    .addEventListener("click", startGame);
}

function update() {
  if (!running) return;

  frame++;
  score += 0.12;
  speed = Math.min(12, 5 + score / 180);

  scoreElement.textContent =
    String(Math.floor(score)).padStart(4, "0");

  // Player physics
  player.vy += player.gravity;
  player.y += player.vy;

  if (player.y >= ground - player.h) {
    player.y = ground - player.h;
    player.vy = 0;
    player.grounded = true;
  }

  // Spawn obstacles
  if (frame % Math.max(48, Math.floor(100 - speed * 3)) === 0) {
    spawnObstacle();
  }

  // Move obstacles
  obstacles.forEach(obstacle => {
    obstacle.x -= speed;
  });

  obstacles = obstacles.filter(o => o.x > -70);

  // Collision check
  const playerBox = {
    x: player.x,
    y: player.y,
    w: player.w,
    h: player.h
  };

  for (const obstacle of obstacles) {
    const box = {
      x: obstacle.x,
      y: ground - obstacle.h,
      w: obstacle.w,
      h: obstacle.h
    };

    if (collision(playerBox, box)) {
      endGame();
      return;
    }
  }
}

function draw() {
  drawBackground();

  obstacles.forEach(obstacle => {
    if (obstacle.type === "tree") {
      drawTree(obstacle.x, ground - 57);
    } else {
      drawRock(obstacle.x, ground - 25);
    }
  });

  drawPlayer();
}

function loop() {
  update();
  draw();

  if (running) {
    requestAnimationFrame(loop);
  }
}

function startGame() {
  score = 0;
  speed = 5;
  frame = 0;
  obstacles = [];

  player.y = ground - player.h;
  player.vy = 0;
  player.grounded = true;

  gameOver = false;
  running = true;

  scoreElement.textContent = "0000";
  overlay.style.display = "none";

  loop();
}

canvas.addEventListener("pointerdown", jump);

document.getElementById("jumpButton")
  .addEventListener("pointerdown", event => {
    event.preventDefault();
    jump();
  });

document.addEventListener("keydown", event => {
  if (event.code === "Space" || event.code === "ArrowUp") {
    event.preventDefault();

    if (!running && !gameOver) {
      startGame();
    } else {
      jump();
    }
  }
});

startButton.addEventListener("click", startGame);

// Initial scene
draw();
</script>

</body>
</html>
